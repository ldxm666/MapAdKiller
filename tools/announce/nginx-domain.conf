# 把域名解析到「非 80/443 高端口」上，绕开阿里云按 Host 头的 ICP 拦截。
#
# 为什么这样能通：
#   阿里云的未备案拦截只作用于 80 和 443 —— 它在那两个端口上按 Host 头/SNI 做判断，
#   命中未备案域名就返回 "Non-compliance ICP Filing" 那个 403 页面（Server: Beaver）。
#   高端口（比如 21119）不在它的拦截范围内，Host 头照常传域名，nginx 正常处理。
#
#   ⚠ 21115~21119 是 RustDesk 的默认端口段。如果这台机器上跑了 RustDesk，
#     这些端口已被占用，nginx 会报 "Address already in use"。
#     先确认: ss -lntp | grep -E ':2111[5-9]'
#     如果被占用，换成任意一个已放行的空端口，用 PORT=xxxxx 覆盖（见 fix-domain.sh）
#
# 为什么不用 443 + 证书先顶着：
#   443 同样在拦截范围里，而且 SNI 会带域名。先把通道打通，再决定要不要上 TLS。

server {
    listen 21119;
    server_name ldxm666.icu;

    root /var/www/html;

    location /mc/ {
        alias /var/www/html/mc/;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;

        gzip off;          # 别让 gzip 改变 ETag
        autoindex off;
    }

    # 其它路径一律 404，避免这台机器暴露别的东西
    location / {
        return 404;
    }
}
