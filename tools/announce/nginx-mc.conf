# MapAdKiller 公告 —— nginx 配置片段
#
# 放到 /etc/nginx/snippets/mc-announce.conf，然后在你的 server{} 里 include。
# 也可以整段贴进现有 server block（最省事，不新增 server）。
#
# 关键点：公告是静态文件，不要让 nginx 去查缓存层，也不要加 gzip 之外的处理。
# ETag 由 nginx 对静态文件自动生成，客户端靠它做 If-None-Match 条件请求。

# ① 如果你已经有 80 的 server block，只加这一段 location 即可：
location /mc/ {
    alias /var/www/html/mc/;

    # 允许跨域（有些 App 内置 WebView 会用到；纯原生请求无所谓，加上无害）
    add_header Access-Control-Allow-Origin "*" always;

    # 客户端必须每次校验 ETag，不能吃中间缓存
    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    # 公告文件很小，别让它被 gzip 折腾出不同的 ETag
    gzip off;

    # 防目录列举
    autoindex off;

    # 只允许这几个文件被访问（push.sh / secret 在 /opt 下，本来也够不到）
    location ~ ^/mc/(announce\.json|announce\.json\.bak)$ {
        alias /var/www/html/mc/$1;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }
    location ~ ^/mc/ {
        return 404;
    }
}


# ② 如果要单独开 443（有证书时）。没有证书就别启用这一段，
